<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Product Filter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>E-Commerce Product Filter</h1>

        <form id="searchForm">

            <input type="text" id="searchBox"
                   placeholder="Enter product name">

            <select id="category">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Books">Books</option>
                <option value="Accessories">Accessories</option>
            </select>

            <button type="submit">Search</button>

            <button type="button" id="clearBtn">
                Clear Filter
            </button>

        </form>

        <p id="errorMessage"></p>

        <div id="productList"></div>

        <div class="author-credits" style="margin-top: 25px; text-align: center; font-size: 13px; color: #666; border-top: 1px dashed #ccc; padding-top: 15px;">
            <p><strong>Developed By:</strong> Samruddhi Kalbande | PRN: 24070521278</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
