<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f8ff">
    <title>My City - Nagpur</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px 88px;
            background: linear-gradient(145deg, #f4f8ff, #fff8ee);
            color: #26364a;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(850px, 100%);
            margin: 0 auto;
        }

        header {
            margin-bottom: 32px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #66758a;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #1261c9;
            font-family: Georgia, serif;
            font-size: clamp(42px, 9vw, 72px);
            line-height: 1.1;
        }

        header p:last-child {
            margin: 12px 0 0;
            color: #53647a;
            font-size: 17px;
        }

        .landmarks {
            padding: 28px;
            border: 1px solid #dce6f2;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 14px 35px rgba(44, 70, 105, 0.09);
        }

        h2 {
            margin: 0 0 20px;
            color: #26364a;
            font-size: 22px;
        }

        .landmark-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .landmark {
            display: flex;
            min-height: 94px;
            align-items: center;
            padding: 18px;
            border-radius: 12px;
            background: #f7f9fc;
            font-size: 19px;
            font-weight: 700;
            line-height: 1.35;
        }

        .deekshabhoomi {
            color: #a43b25;
            font-family: Georgia, serif;
            font-style: italic;
        }

        .zero-mile {
            color: #256b48;
            font-family: "Trebuchet MS", sans-serif;
            letter-spacing: 0.03em;
        }

        .futala-lake {
            color: #2466b3;
            font-family: "Courier New", monospace;
            font-weight: 700;
        }

        .sitabuldi-fort {
            color: #80509b;
            font-family: "Times New Roman", serif;
            font-weight: 700;
        }

        .college {
            color: #c12657;
            font-family: "Trebuchet MS", sans-serif;
            animation: blink 1.2s steps(2, start) infinite;
        }

        .college:focus {
            animation-play-state: paused;
            outline: 2px solid currentColor;
            outline-offset: 4px;
        }

        @keyframes blink {
            to {
                visibility: hidden;
            }
        }

        .ticker {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
            padding: 14px 0;
            background: #1261c9;
            color: #fff;
        }

        .ticker p {
            width: max-content;
            margin: 0;
            padding-left: 100%;
            animation: scroll-message 18s linear infinite;
            font-size: 16px;
            font-weight: 700;
        }

        .ticker:hover p,
        .ticker:focus-within p {
            animation-play-state: paused;
        }

        @keyframes scroll-message {
            to {
                transform: translateX(-100%);
            }
        }

        @media (max-width: 560px) {
            body {
                padding: 30px 14px 76px;
            }

            .landmarks {
                padding: 20px;
            }

            .landmark-list {
                grid-template-columns: 1fr;
            }

            .landmark {
                min-height: 74px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">Welcome to</p>
            <h1>Nagpur</h1>
            <p>The Orange City, full of history, culture, and warm hospitality.</p>
        </header>

        <section class="landmarks" aria-labelledby="landmarks-title">
            <h2 id="landmarks-title">Landmarks of my city</h2>
            <ul class="landmark-list">
                <li class="landmark deekshabhoomi">Deekshabhoomi</li>
                <li class="landmark zero-mile">Zero Mile Stone</li>
                <li class="landmark futala-lake">Futala Lake</li>
                <li class="landmark sitabuldi-fort">Sitabuldi Fort</li>
                <li class="landmark college" tabindex="0">Symbiosis Institute of Technology</li>
            </ul>
        </section>
    </main>

    <footer class="ticker" aria-label="City message">
        <p>Nagpur welcomes you — discover the heart of Maharashtra!</p>
    </footer>
</body>
</html>
