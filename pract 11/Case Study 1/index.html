<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Workshop Ticket Booking</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4f1 0%, #fff6fb 100%);
            margin: 0;
            padding: 0;
            color: #4d2c3d;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(214, 87, 149, 0.25);
            border: 1px solid #f5c7dc;
        }

        h1 {
            text-align: center;
            color: #c2185b;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #7a3559;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #f3bfd6;
            border-radius: 6px;
            background-color: #fffafc;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.15);
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        .option {
            margin-top: 8px;
            color: #5a3348;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: linear-gradient(135deg, #ec4899, #f472b6);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: linear-gradient(135deg, #db2777, #ec4899);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Technical Workshop Ticket Booking</h1>

    <form id="workshopForm">

        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="prn">PRN / Student ID:</label>
        <input type="text" id="prn" name="prn" placeholder="Enter your PRN" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="phone">Mobile Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter mobile number" required>

        <label for="college">College Name:</label>
        <input type="text" id="college" name="college" placeholder="Enter college name" required>

        <label for="branch">Branch:</label>
        <select id="branch" name="branch" required>
            <option value="">Select Branch</option>
            <option value="CSE">Computer Science Engineering</option>
            <option value="IT">Information Technology</option>
            <option value="ECE">Electronics and Communication</option>
            <option value="Mechanical">Mechanical Engineering</option>
            <option value="Civil">Civil Engineering</option>
        </select>

        <label for="year">Year of Study:</label>
        <select id="year" name="year" required>
            <option value="">Select Year</option>
            <option value="First">First Year</option>
            <option value="Second">Second Year</option>
            <option value="Third">Third Year</option>
            <option value="Fourth">Fourth Year</option>
        </select>

        <label>Workshop Type:</label>

        <div class="option">
            <input type="radio" name="workshop" value="AI" required>
            Artificial Intelligence
        </div>

        <div class="option">
            <input type="radio" name="workshop" value="Web">
            Web Development
        </div>

        <div class="option">
            <input type="radio" name="workshop" value="Cyber">
            Cyber Security
        </div>

        <label for="date">Workshop Date:</label>
        <input type="date" id="date" name="date" required>

        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" name="tickets" min="1" max="5" required>

        <label for="requirements">Additional Requirements:</label>
        <textarea id="requirements" name="requirements" rows="4" placeholder="Enter additional requirements"></textarea>

        <div class="option">
            <input type="checkbox" id="terms" name="terms" required>
            I agree to the terms and conditions
        </div>

        <button type="submit">Book Workshop Ticket</button>

    </form>

</div>

<script>
    const form = document.getElementById('workshopForm');

    form.addEventListener('focusin', function (event) {
        const field = event.target;
        if (field.tagName === 'INPUT' || field.tagName === 'SELECT' || field.tagName === 'TEXTAREA') {
            field.style.border = '2px solid #ec4899';
            field.style.backgroundColor = '#fff1f7';
        }
    });

    form.addEventListener('focusout', function (event) {
        const field = event.target;
        if (field.tagName === 'INPUT' || field.tagName === 'SELECT' || field.tagName === 'TEXTAREA') {
            field.style.border = '1px solid #f3bfd6';
            field.style.backgroundColor = '#fffafc';
        }
    });

    form.addEventListener('change', function (event) {
        const field = event.target;
        if (field.name === 'branch' || field.name === 'year' || field.name === 'workshop') {
            console.log('Selection changed:', field.name, field.value);
        }
    });

    form.addEventListener('submit', function (event) {
        event.preventDefault();

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        localStorage.setItem('workshopRegistration', JSON.stringify(data));
        sessionStorage.setItem('workshopSessionRegistration', JSON.stringify(data));

        alert('Workshop ticket booking saved successfully!');
        form.reset();
    });
</script>

</body>
</html>
