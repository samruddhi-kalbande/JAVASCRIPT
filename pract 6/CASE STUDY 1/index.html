<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">

        <h1>Sign In</h1>
        <p class="subtitle">Enter your email and password to proceed</p>

        <div class="line"></div>

        <form id="loginForm">

            <label for="email">Email Address</label>

            <div class="input-box">
                <span>✉</span>
                <input
                    type="email"
                    id="email"
                    placeholder="name@example.com"
                    required
                >
            </div>

            <label for="password">Password</label>

            <div class="input-box">
                <span>🔑</span>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Log In →
            </button>

        </form>

        <div class="or">
            <span>or</span>
        </div>

        <button class="register-btn" onclick="goToRegister()">
            Create New Account (Register) →
        </button>

        <p class="demo">
            Demo: <strong>user@example.com</strong> /
            <strong>Password@123</strong>
        </p>

        <p id="loginMessage"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
